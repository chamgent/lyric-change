version: '3.8'

services:
  lyric-change:
    build:
      context: .
      dockerfile: Dockerfile
    image: lyric-change:latest
    container_name: lyric-change
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      # 不设置时自动先试 hf-mirror.com，失败回退 huggingface.co；
      # 如需指定下载源：HF_ENDPOINT=https://... docker compose up -d
      - HF_ENDPOINT
    volumes:
      # 持久化模型权重，避免容器重建后重复下载
      - ./pretrained_models:/app/SoulX-Singer/pretrained_models
      # 持久化输出音频与元数据
      - ./outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
